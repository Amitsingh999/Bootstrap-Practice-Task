<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Create account Form for Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <main>
        <section class="container d-flex align-items-center justify-content-center">
            <div class="card p-5 border-0 bg-light">
                <h3 class="text-center">Create Account</h3>
                <p class="text-center text-muted">Get started with your free account</p>
 
                <div class="d-grid gap-2 mb-3">
                    <button class="btn btn-info text-white"><i class="bi bi-twitter me-2"></i>Login via Twitter</button>
                    <button class="btn btn-primary"><i class="bi bi-facebook me-2"></i>Login via Facebook</button>
                </div>

                <div class="text-center mb-3">
                    <span class="text-muted">------------------------ OR -----------------------</span>
                </div>

                <form>
                    <div class="mb-2">
                      <label for="fullname" class="form-label">Full Name</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="fullname" placeholder="Full name" required>
                      </div>
                    </div>
                  
                    <div class="mb-2">
                      <label for="email" class="form-label">Email Address</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="Email address" required>
                      </div>
                    </div>
                  
                    <div class="mb-2">
                      <label for="phone" class="form-label">Phone Number</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <span class="input-group-text">+971</span>
                        <input type="tel" class="form-control" id="phone" placeholder="Phone number" required>
                      </div>
                    </div>
                  
                    <div class="mb-2">
                      <label for="job" class="form-label">Job Type</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                        <select class="form-select" id="job">
                          <option selected disabled>Select job type</option>
                          <option>Developer</option>
                          <option>Designer</option>
                          <option>Manager</option>
                        </select>
                      </div>
                    </div>
                  
                    <div class="mb-2">
                      <label for="password" class="form-label">Create Password</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Create password" required>
                      </div>
                    </div>
                  
                    <div class="mb-3">
                      <label for="repeat-password" class="form-label">Repeat Password</label>
                      <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="repeat-password" placeholder="Repeat password" required>
                      </div>
                    </div>
                  
                    <div class="d-grid">
                      <button type="submit" class="btn btn-primary">Create Account</button>
                    </div>
                  
                    <p class="text-center mt-3">
                      Have an account? <a href="#">Log In</a>
                    </p>
                  </form>
                  
            </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
